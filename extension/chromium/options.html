<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Crazy Download Manager – Integration options</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="options">
  <h2>Crazy Download Manager</h2>
  <p class="muted">Paste the pairing token from the app: <b>Options → Browser → Extension pairing token</b>.</p>
  <label>Token <input id="token" spellcheck="false" placeholder="32 hex characters" /></label>
  <label>Port <input id="port" type="number" min="1" max="65535" /></label>
  <label class="row"><input type="checkbox" id="enabled" /> Take over browser downloads (hold <b>Alt</b> while clicking a link to skip)</label>
  <label class="row"><input type="checkbox" id="videoPanel" /> Show “Download this video” panel on videos</label>
  <label>Ignore media smaller than (KB) <input id="minMediaKB" type="number" min="0" /></label>
  <div class="actions">
    <button id="save" class="primary">Save</button>
    <button id="test">Test connection</button>
    <span id="result"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
